name: CI/CD Pipeline

permissions:
    contents: read

# Actions are pinned to a full commit SHA (the tag is in the comment) so a moved tag cannot change what runs;
# Dependabot proposes updates weekly (.github/dependabot.yml).
on:
    push:
        branches:
            - main
            - develop
            - "feature/**"
    pull_request:
        branches:
            - main
            - develop
    # A merge into main publishes once the tests pass (owner's choice, 2026-10-23). Run workflow republishes main by hand,
    # for example after a failed deploy, and needs the box ticked.
    workflow_dispatch:
        inputs:
            confirm_production:
                description: "Publish the reviewed main commit to espruar.com"
                required: true
                type: boolean
                default: false

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest
        timeout-minutes: 15
        concurrency:
            group: tests-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            # Every npm package here is a development tool; none reaches visitors. High and critical advisories fail
            # the build (update the dependency, or record a reviewed exception in DECISIONS.md and adjust this step);
            # low and moderate ones are listed in the log without failing it.
            - name: Check for vulnerabilities
              run: |
                  npm audit || true
                  npm audit --audit-level=high

            - name: Run project checks
              run: npm run check

    # Publishes only dist/ (the files in release-files.json) through GitHub Pages' own deployment, so nothing else in
    # the repository is served. Needs Settings > Pages > Source: "GitHub Actions"; the custom domain is set there too.
    deploy-prod:
        name: Deploy to Production
        runs-on: ubuntu-latest
        timeout-minutes: 20
        needs: test
        if: github.repository == 'bradleynelson/elf-name-generator' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production == true))
        permissions:
            contents: read
            pages: write
            id-token: write
        concurrency:
            group: production-release
            cancel-in-progress: false
        environment:
            name: github-pages
            url: https://espruar.com

        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: "24"

            - name: Build approved website assets
              run: node scripts/release-site.js build

            - name: Verify release contents
              run: node scripts/release-site.js check

            - name: Package the approved files for Pages
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: ./dist
                  # per attempt: re-running the job adds a second artifact to the run, and deploy-pages will not choose
                  name: github-pages-${{ github.run_attempt }}

            - name: Deploy to GitHub Pages
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
              with:
                  artifact_name: github-pages-${{ github.run_attempt }}

            - name: Check the live site serves only the approved files
              run: node scripts/check-live-site.js https://espruar.com
