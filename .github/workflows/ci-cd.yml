name: CI/CD Pipeline

permissions:
    contents: read

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main
            - develop
    workflow_dispatch:
        inputs:
            confirm_production:
                description: "Publish the reviewed main commit to espruar.com"
                required: true
                type: boolean
                default: false

jobs:
    test:
        name: Run Tests
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Check for vulnerabilities
              run: npm audit --audit-level=moderate || true

            - name: Lint code
              run: npm run lint

            - name: Check formatting
              run: npm run format:check

            - name: Run tests
              run: npm run test:run

            - name: Test release safeguards
              run: npm run test:release

            - name: Build approved website assets
              run: npm run build:site

            - name: Verify release contents
              run: npm run check:release

            - name: Run tests with coverage
              if: github.event_name == 'pull_request'
              run: npm run test:run -- --coverage

    deploy-prod:
        name: Deploy to Production
        runs-on: ubuntu-latest
        needs: test
        if: github.repository == 'bradleynelson/elf-name-generator' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.confirm_production == true
        permissions:
            contents: write
        concurrency:
            group: production-release
            cancel-in-progress: false
        environment:
            name: production
            url: https://espruar.com

        steps:
            - name: Checkout code
              uses: actions/checkout@v4
              with:
                  persist-credentials: false

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "20"

            - name: Build approved website assets
              run: node scripts/release-site.js build

            - name: Verify release contents
              run: node scripts/release-site.js check

            - name: Deploy to GitHub Pages
              uses: peaceiris/actions-gh-pages@v3
              with:
                  github_token: ${{ secrets.GITHUB_TOKEN }}
                  publish_dir: ./dist
                  cname: espruar.com
